services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress_product-wordpress-1
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-ThayTheBangMatKhauUser123!}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress_db}
    volumes:
      - ./app:/var/www/html
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: wordpress_product-mysql-1
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ThayTheBangMatKhauRootNgauNhien123!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ThayTheBangMatKhauUser123!}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: wordpress_product-phpmyadmin-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: wordpress_product-nginx-1
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: monitoring-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: monitoring-mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "root:MinhDepTrai2026!@(mysql:3306)/"
    networks:
      - backend

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: monitoring-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:8082/stub_status
    networks:
      - backend

  loki:
    image: grafana/loki:3.0.0
    container_name: logging-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.0.0
    container_name: logging-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  backend:
    driver: bridge
